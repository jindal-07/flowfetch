services:
  - type: web
    name: flowfetch
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      # Microsoft Graph app-only access (Application permission Files.Read.All
      # with admin consent). Fill these in the Render dashboard.
      - key: AZURE_CLIENT_ID
        sync: false
      - key: AZURE_CLIENT_SECRET
        sync: false
      # Your real tenant ID; "common" cannot issue app-only tokens.
      - key: AZURE_TENANT_ID
        sync: false
      # Password for the login screen. Strongly recommended, since the
      # server can read all tenant files. Changing it logs everyone out.
      - key: FLOWFETCH_PASSWORD
        sync: false
      # How long "Remember me" keeps a device logged in.
      - key: FLOWFETCH_REMEMBER_DAYS
        value: "30"
